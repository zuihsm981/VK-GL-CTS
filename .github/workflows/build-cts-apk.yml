name: Build VK-GL-CTS APK

on:
  workflow_dispatch:
    inputs:
      target_abi:
        description: '选择目标 ABI（32位选 armeabi-v7a 或 x86）'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Setup Android SDK with API 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Export NDK and SDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache external sources
        uses: actions/cache@v4
        with:
          path: external
          key: ${{ runner.os }}-external-${{ hashFiles('external/fetch_sources.py') }}
          restore-keys: |
            ${{ runner.os }}-external-

      - name: Fetch external sources
        run: |
          python3 external/fetch_sources.py
          python3 -m pip install lxml

      - name: Build APK (${{ github.event.inputs.target_abi }}, Release)
        run: |
          python3 scripts/android/build_apk.py \
            --sdk "$ANDROID_HOME" \
            --ndk "$ANDROID_NDK_HOME" \
            --abis "${{ github.event.inputs.target_abi }}" \
            --native-build-type Release \
            --build-root "$GITHUB_WORKSPACE/build"

      - name: Locate generated APK
        if: always()
        run: |
          echo "=== APK files under build/ ==="
          find build -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-apk-${{ github.event.inputs.target_abi }}
          path: 'build/package/*.apk'
          if-no-files-found: warn