name: Build VK-GL-CTS APK

on:
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 'r26b' # 可替换为 NDK r17c 或更高版本

      - name: Fetch external sources
        run: |
          python3 external/fetch_sources.py
          python3 -m pip install lxml

      - name: Build APK
        run: |
          # 指定构建 arm64-v8a 架构的 APK
          python3 scripts/android/build_apk.py --sdk $ANDROID_HOME --ndk $ANDROID_NDK_HOME --abis arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dEQP-apk
          path: '**/dEQP.apk' # 根据实际生成路径调整
